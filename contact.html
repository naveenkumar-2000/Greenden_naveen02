<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- nav bar section -->
    <nav
      class="bg-green-100 flex items-center justify-between p-3 shadow-xl sticky top-0 z-1"
    >
      <h1 class="text-2xl">Greenden</h1>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6 md:hidden"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
        />
      </svg>

      <ul class="flex gap-5 text-gray-600 hidden md:flex">
        <li>
          <a href="index.html" class="hover:underline hover:text-black">Home</a>
        </li>

        <li>
          <a href="products.html" class="hover:underline hover:text-black">Products</a>
        </li>

        <li>
          <a href="contact.html" class="hover:underline hover:text-black">Contact</a>
        </li>
      </ul>
    </nav>

    <section class="bg-white">
        <div class="py-8 lg:py-16 px-4 mx-auto max-w-screen-md">
            <p class="mb-8 lg:mb-16 font-light text-center text-gray-500 dark:text-gray-400 sm:text-xl">Got a technical issue? Want to send feedback about a beta feature? Need details about our Business plan? Let us know.</p>
            <h2 class="mb-4 text-4xl tracking-tight font-extrabold text-center text-gray-900 dark:text-white">Contact Us</h2>
            <form action="#" class="space-y-8">
                <div>
                    <label for="email" class="block mb-2 text-sm font-medium text-black  ">Your email</label>
                    <input type="email" id="email" class="outline-gray-400 shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:border-gray-200 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" placeholder="name@flowbite.com" required>
                </div>
                <div>
                    <label for="subject" class="block mb-2 text-sm font-medium text-black">Subject</label>
                    <input type="text" id="subject" class="outline-gray-400 block p-3 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 shadow-sm focus:ring-primary-500 focus:border-primary-500  dark:border-gray-200 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" placeholder="Let us know how we can help you" required>
                </div>
                <div class="sm:col-span-2">
                    <label for="message" class="block mb-2 text-sm font-medium text-black">Your message</label>
                    <textarea id="message" rows="6" class="outline-gray-400  resize-none block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg shadow-sm border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:border-gray-200 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Leave a comment..."></textarea>
                </div>
                <button class="border border-gray-200 hover:border-gray-600 hover:shadow-2xl rounded-2xl p-1.5">Send message</button>
            </form>
        </div>
      </section>

    <!-- Footer Section -->
        <div class="p-5 bg-green-100 mt-2">
          <h1 class="m-5 text-4xl font-bold">Greenden</h1>
          <p class="m-5">The Standard chunk of Lorem ipsum used since the 1500s is reprodused below for those interest</p>
          <p class="m-5">&copy;2026 Greenday.com</p>
        </div>
</body>
</html>
